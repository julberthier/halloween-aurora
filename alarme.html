<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURORA // ALARME</title>
<link rel="stylesheet" href="assets/style.css?v=5">
<style>
#app{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(16px,3vh,30px);padding:24px;text-align:center}
h1{font-family:var(--font-title);font-weight:900;font-size:clamp(1.2em,4vmin,2.2em);letter-spacing:.35em;text-indent:.35em;color:#fff;text-shadow:0 0 20px rgba(0,200,255,.6)}
#state{font-size:clamp(.8em,2.2vmin,1.05em);letter-spacing:.3em;color:var(--blue-soft);text-transform:uppercase}
#go{width:clamp(150px,30vmin,240px);height:clamp(150px,30vmin,240px);border-radius:50%;border:2px solid var(--blue);
  background:radial-gradient(circle,rgba(0,200,255,.18),rgba(0,200,255,.04));color:#fff;
  font:900 clamp(.9em,2.6vmin,1.25em) var(--font-title);letter-spacing:.2em;text-indent:.2em;box-shadow:0 0 40px rgba(0,200,255,.25)}
#go:disabled{opacity:.4;cursor:wait}
body.on #go{border-color:var(--red);background:radial-gradient(circle,rgba(255,30,60,.35),rgba(255,30,60,.06));box-shadow:0 0 60px rgba(255,30,60,.5);animation:pul 1.2s ease-in-out infinite}
body.on h1{text-shadow:0 0 22px rgba(255,30,60,.8)}
body.on #state{color:#ff5468}
@keyframes pul{50%{box-shadow:0 0 90px rgba(255,30,60,.8)}}
.row{display:flex;align-items:center;gap:14px;font-size:.85em;letter-spacing:.2em;color:var(--blue-soft);text-transform:uppercase}
input[type=range]{width:min(60vw,320px);accent-color:var(--blue)}
body.on input[type=range]{accent-color:var(--red)}
#meta{font-size:.75em;letter-spacing:.15em;color:#4d7f9e;line-height:1.9;text-transform:uppercase}
#bars{display:flex;gap:4px;align-items:flex-end;height:40px}
#bars i{width:6px;background:var(--blue);opacity:.5;height:4px;transition:height .08s}
body.on #bars i{background:var(--red);opacity:.9}
</style>
</head>
<body>
<div id="app">
  <h1>AURORA // ALARME</h1>
  <div id="state">Chargement du son…</div>
  <button id="go" disabled>…</button>
  <div id="bars"></div>
  <div class="row">Volume <input id="vol" type="range" min="0" max="100" value="80"> <span id="volv">80 %</span></div>
  <div id="meta">Lecture en boucle sans fin · espace = marche / arrêt<br><span id="info">—</span></div>
</div>
<div id="scanlines"></div>
<script>
(function(){
"use strict";
var SRC = "assets/alerte-aqua-boucle.mp3";
var $ = function(id){ return document.getElementById(id); };
var ctx = null, buf = null, src = null, gain = null, an = null, on = false, t0 = 0, raw = null;

/* téléchargement dès l'ouverture : le son est prêt avant le clic */
fetch(SRC).then(function(r){ if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
  .then(function(a){ raw = a; $("go").disabled = false; $("go").textContent = "DÉMARRER"; $("state").textContent = "Prête — en veille"; })
  .catch(function(e){ $("state").textContent = "Son introuvable (" + e.message + ") — rechargez la page"; });

function ensure(){
  if (ctx) return Promise.resolve();
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  gain = ctx.createGain(); an = ctx.createAnalyser(); an.fftSize = 64;
  gain.connect(an); an.connect(ctx.destination);
  return ctx.decodeAudioData(raw.slice(0)).then(function(b){ buf = b; trim(b); });
}
/* repère le vrai début et la vraie fin du son (le fichier finit par ~0,9 s de silence) :
   la boucle saute ces blancs, sans couture audible */
var L0 = 0, L1 = 0;
function trim(b){
  var d = b.getChannelData(0), n = d.length, th = 0.003, i = 0, j = n - 1;
  while (i < n && Math.abs(d[i]) < th) i++;
  while (j > i && Math.abs(d[j]) < th) j--;
  L0 = i / b.sampleRate; L1 = Math.min(b.duration, (j + 1) / b.sampleRate + 0.02);
}
function vol(){ return Math.pow($("vol").value / 100, 2); }
function start(){
  ensure().then(function(){
    ctx.resume();
    src = ctx.createBufferSource(); src.buffer = buf; src.loop = true; src.loopStart = L0; src.loopEnd = L1;   /* boucle sans blanc */
    src.connect(gain);
    var n = ctx.currentTime; gain.gain.cancelScheduledValues(n); gain.gain.setValueAtTime(0, n); gain.gain.linearRampToValueAtTime(vol(), n + 1.5);
    src.start(n, L0); t0 = n; on = true; document.body.classList.add("on");
    $("go").textContent = "ARRÊTER"; $("state").textContent = "Alarme en cours";
    if (navigator.wakeLock) navigator.wakeLock.request("screen").catch(function(){});
  });
}
function stop(){
  if (!src) return;
  var s = src, n = ctx.currentTime; src = null; on = false;
  gain.gain.cancelScheduledValues(n); gain.gain.setValueAtTime(gain.gain.value, n); gain.gain.linearRampToValueAtTime(0, n + 1);
  setTimeout(function(){ try { s.stop(); } catch(e){} }, 1100);
  document.body.classList.remove("on"); $("go").textContent = "DÉMARRER"; $("state").textContent = "En veille";
}
function toggle(){ if ($("go").disabled) return; if (on) stop(); else start(); }
$("go").addEventListener("click", toggle);
document.addEventListener("keydown", function(e){ if (e.code === "Space" && !e.repeat){ e.preventDefault(); toggle(); } });
$("vol").addEventListener("input", function(){
  $("volv").textContent = this.value + " %";
  if (ctx && on) gain.gain.setTargetAtTime(vol(), ctx.currentTime, .05);
});

/* vu-mètre + compteur */
for (var i = 0; i < 16; i++) $("bars").appendChild(document.createElement("i"));
var bars = $("bars").children, data = new Uint8Array(32);
(function draw(){
  if (an && on){ an.getByteFrequencyData(data); for (var i = 0; i < 16; i++) bars[i].style.height = (4 + data[i + 1] / 255 * 36) + "px"; }
  else for (var j = 0; j < 16; j++) bars[j].style.height = "4px";
  if (on && buf){
    var el = ctx.currentTime - t0, m = Math.floor(el / 60), s = Math.floor(el % 60);
    $("info").textContent = "En marche depuis " + m + " min " + (s < 10 ? "0" : "") + s + " s · tour n° " + (Math.floor(el / (L1 - L0)) + 1);
  } else if (buf) $("info").textContent = "Durée d'un tour : " + Math.round(L1 - L0) + " s";
  requestAnimationFrame(draw);
})();
window.__alarme = { get on(){ return on; }, get ctx(){ return ctx; }, get buf(){ return buf; }, get gain(){ return gain ? gain.gain.value : 0; }, get loop(){ return [L0, L1]; } };
})();
</script>
</body>
</html>
