<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AURORA // BALISE</title>
<style>
:root{--bg:#01040a;--ink:#eaf6ff;--blue:#00c8ff;--soft:#7fd4ff;--dim:#4d7f9e;--red:#ff1e3c}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:'Share Tech Mono','Consolas',monospace;user-select:none;-webkit-user-select:none}
#app{height:100dvh;display:none;flex-direction:column}
#bar{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;
  border-bottom:1px solid rgba(0,200,255,.3);font-size:13px;letter-spacing:.15em;text-transform:uppercase;color:var(--soft)}
#grp{color:#fff;font-weight:700}
#net{padding:2px 9px;border:1px solid rgba(255,30,60,.5);border-radius:3px;color:var(--red);font-size:11px}
#net.ok{color:#00ff6a;border-color:rgba(0,255,106,.5)}
#cam{flex:1 1 auto;position:relative;min-height:0;background:#000}
#cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#voice{position:absolute;left:0;right:0;top:0;z-index:3;padding:10px;text-align:center;font-size:14px;letter-spacing:.25em;
  background:rgba(255,30,60,.85);color:#fff;display:none}
#voice.on{display:block}
#rows{flex:0 0 auto;padding:10px 12px;border-top:1px solid rgba(0,200,255,.3);font-size:12px;letter-spacing:.08em;line-height:1.9;text-transform:uppercase;color:var(--dim)}
#rows b{color:var(--blue);font-weight:400}
#rows b.ko{color:var(--red)}
#act{flex:0 0 auto;display:flex;gap:8px;padding:0 12px 12px}
.btn{flex:1;background:rgba(0,200,255,.1);border:1px solid rgba(0,200,255,.55);color:#fff;padding:13px 8px;
  font:700 12px 'Share Tech Mono',monospace;letter-spacing:.15em;border-radius:5px}
.btn:active{background:rgba(0,200,255,.35)}
#pick{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:22px;text-align:center}
#pick h1{font-size:18px;letter-spacing:.35em;color:#fff}
#pick p{font-size:12px;color:var(--dim);letter-spacing:.1em;line-height:1.8;max-width:420px}
#groups{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.g{width:86px;height:86px;border:1px solid rgba(0,200,255,.5);border-radius:6px;background:rgba(0,200,255,.07);color:#fff;font:700 24px 'Share Tech Mono',monospace}
.g small{display:block;font-size:9px;font-weight:400;color:var(--dim);letter-spacing:.15em;margin-top:4px}
.g:active{background:rgba(0,200,255,.3)}
#perr{color:var(--red);font-size:12px;min-height:1em;max-width:420px;line-height:1.6}
</style>
</head>
<body>
<div id="pick">
  <h1>AURORA // BALISE</h1>
  <p>Accompagnateur : choisissez le groupe que vous escortez.<br>Autorisez la <b style="color:#fff">caméra</b> et la <b style="color:#fff">position</b>. Gardez le téléphone en main, caméra vers l'avant, volume au maximum.</p>
  <div id="groups"></div>
  <div id="perr"></div>
</div>
<div id="app">
  <div id="bar"><span>BALISE <span id="grp">—</span></span><span id="net">HORS LIGNE</span></div>
  <div id="cam"><video id="me" autoplay muted playsinline></video><div id="voice">◉ LES GUIDES VOUS PARLENT</div></div>
  <div id="rows">
    liaison standard : <b id="r-link" class="ko">recherche…</b><br>
    vidéo : <b id="r-vid" class="ko">—</b> · position : <b id="r-gps" class="ko">—</b>
  </div>
  <div id="act"><button class="btn" id="b-snd">PAS DE SON ? TOUCHER</button><button class="btn" id="b-cam">CHANGER CAMÉRA</button></div>
</div>
<audio id="voiceout" autoplay playsinline></audio>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function(){
"use strict";
var PREFIX = "jb-aurora14-", STD_ID = PREFIX + "standard";
var $ = function(id){ return document.getElementById(id); };
var n = 0, cam = null, silent = null, outStream = null, peer = null, call = null, conn = null;
var pos = null, facing = "environment", actx = null;

for (var i = 1; i <= 5; i++) (function(g){
  var b = document.createElement("button"); b.className = "g"; b.innerHTML = "G" + g + "<small>GROUPE " + g + "</small>";
  b.onclick = function(){ start(g); }; $("groups").appendChild(b);
})(i);

function setNet(t, ok){ $("net").textContent = t; $("net").className = ok ? "ok" : ""; }
function row(id, t, ok){ $(id).textContent = t; $(id).className = ok ? "" : "ko"; }

/* piste audio silencieuse : permet de RECEVOIR la voix sans demander le micro */
function silentTrack(){
  actx = actx || new (window.AudioContext || window.webkitAudioContext)();
  var o = actx.createOscillator(), gn = actx.createGain(), d = actx.createMediaStreamDestination();
  gn.gain.value = 0; o.connect(gn); gn.connect(d); o.start();
  return d.stream.getAudioTracks()[0];
}
function getCam(){
  return navigator.mediaDevices.getUserMedia({ audio: false, video: {
    facingMode: { ideal: facing }, width: { ideal: 640 }, height: { ideal: 360 }, frameRate: { ideal: 15, max: 20 } } });
}
function buildOut(){
  outStream = new MediaStream();
  cam.getVideoTracks().forEach(function(t){ outStream.addTrack(t); });
  if (silent) outStream.addTrack(silent);
}

function start(g){
  $("perr").textContent = "";
  n = g;
  try { silent = silentTrack(); actx.resume(); } catch(e){}
  try { $("voiceout").play().catch(function(){}); } catch(e){}
  getCam().then(function(s){
    cam = s; $("me").srcObject = s; buildOut();
    $("pick").style.display = "none"; $("app").style.display = "flex"; $("grp").textContent = "G" + n;
    row("r-vid", "caméra active", true);
    history.replaceState(null, "", "?g=" + n);
    wake(); gps(); startPeer();
  }).catch(function(e){
    $("perr").textContent = "CAMÉRA REFUSÉE — autorisez la caméra dans les réglages du navigateur puis réessayez (" + (e && e.name) + ")";
  });
}

function wake(){
  if (!("wakeLock" in navigator)) return;
  navigator.wakeLock.request("screen").catch(function(){});
}
document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible" && n){ wake(); if (actx) actx.resume(); } });

function gps(){
  if (!navigator.geolocation){ row("r-gps", "indisponible", false); return; }
  navigator.geolocation.watchPosition(function(p){
    pos = { lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy) };
    row("r-gps", "±" + pos.acc + " m", pos.acc <= 30);
    send();
  }, function(e){ row("r-gps", e.code === 1 ? "refusée" : "recherche…", false); },
  { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 });
}
function send(){ if (conn && conn.open){ try { conn.send({ t: "state", g: n, pos: pos }); } catch(e){} } }
setInterval(send, 2000);

function startPeer(){
  setNet("CONNEXION…", false);
  peer = new Peer(PREFIX + "g" + n + "-" + Math.random().toString(36).slice(2, 7), { debug: 1 });
  peer.on("open", function(){ setNet("EN LIGNE", true); dial(); });
  peer.on("disconnected", function(){ setNet("RECONNEXION…", false); setTimeout(function(){ try { peer.reconnect(); } catch(e){} }, 1500); });
  peer.on("error", function(e){
    if (e.type === "peer-unavailable") row("r-link", "standard non ouvert — nouvel essai…", false);
    else if (/network|server|socket/.test(e.type)) setNet("RÉSEAU…", false);
  });
}
function dial(){
  if (!peer || peer.destroyed || !peer.open) return;
  if (!conn || !conn.open){
    try { if (conn) conn.close(); } catch(e){}
    conn = peer.connect(STD_ID, { metadata: { g: n }, reliable: true });
    conn.on("open", function(){ send(); });
    conn.on("data", function(d){ if (d && d.t === "talk") $("voice").classList.toggle("on", !!d.on); });
    conn.on("close", function(){ $("voice").classList.remove("on"); });
  }
  if (!call || !call.open){
    try { if (call) call.close(); } catch(e){}
    call = peer.call(STD_ID, outStream, { metadata: { g: n } });
    if (!call) return;
    call.on("stream", function(rs){
      var a = $("voiceout"); a.srcObject = rs; a.volume = 1; a.play().catch(function(){});
      row("r-link", "établie — voix et vidéo", true);
    });
    call.on("close", function(){ row("r-link", "perdue — reconnexion…", false); });
    call.on("error", function(){});
    setTimeout(capBitrate, 2500);
  }
}
/* débit limité : 5 vidéos doivent passer sur le même wifi */
function capBitrate(){
  try {
    call.peerConnection.getSenders().forEach(function(s){
      if (!s.track || s.track.kind !== "video") return;
      var p = s.getParameters(); if (!p.encodings || !p.encodings.length) p.encodings = [{}];
      p.encodings[0].maxBitrate = 380000; p.encodings[0].maxFramerate = 15;
      s.setParameters(p).catch(function(){});
    });
  } catch(e){}
}
/* surveillance : rappelle le standard tant que la liaison n'est pas complète */
setInterval(function(){
  if (!n || !peer) return;
  if (peer.destroyed){ startPeer(); return; }
  var st = call && call.peerConnection ? call.peerConnection.connectionState : "none";
  if (!call || !call.open || st === "failed" || st === "closed" || !conn || !conn.open) dial();
}, 3000);

$("b-snd").onclick = function(){
  if (actx) actx.resume();
  var a = $("voiceout"); a.muted = false; a.volume = 1; a.play().catch(function(){});
  var b = this; b.textContent = "SON RÉACTIVÉ"; setTimeout(function(){ b.textContent = "PAS DE SON ? TOUCHER"; }, 1500);
};
$("b-cam").onclick = function(){
  facing = facing === "environment" ? "user" : "environment";
  getCam().then(function(s){
    var nt = s.getVideoTracks()[0];
    if (call && call.peerConnection) call.peerConnection.getSenders().forEach(function(se){ if (se.track && se.track.kind === "video") se.replaceTrack(nt); });
    cam.getTracks().forEach(function(t){ t.stop(); });
    cam = s; $("me").srcObject = s; buildOut();
  }).catch(function(){});
};

var q = /[?&]g=([1-5])/.exec(location.search);
if (q){
  /* lien direct : un toucher reste nécessaire pour la caméra et le son */
  $("groups").innerHTML = "";
  var b = document.createElement("button"); b.className = "g"; b.style.width = "200px";
  b.innerHTML = "DÉMARRER<small>BALISE G" + q[1] + "</small>"; b.onclick = function(){ start(+q[1]); };
  $("groups").appendChild(b);
}
window.__balise = { get call(){ return call; }, get conn(){ return conn; } };
})();
</script>
</body>
</html>
