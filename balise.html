<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURORA // BALISE</title>
<style>
:root{--bg:#01040a;--ink:#eaf6ff;--blue:#00c8ff;--blue-soft:#7fd4ff;--red:#ff1e3c}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:'Share Tech Mono','Consolas',monospace;user-select:none}
#app{height:100dvh;display:flex;flex-direction:column}
/* ── barre d'état ── */
#bar{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;
  padding:8px 14px;border-bottom:1px solid rgba(0,200,255,.3);
  font-size:12px;letter-spacing:.15em;color:var(--blue-soft);text-transform:uppercase}
#grp{color:var(--white);font-weight:700}
#net{padding:3px 10px;border:1px solid rgba(0,200,255,.4);border-radius:3px}
#net.ok{color:#00ff6a;border-color:rgba(0,255,106,.5)}
#net.ko{color:var(--red);border-color:rgba(255,30,60,.5);animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:.3}}
/* ── zone principale ── */
#main{flex:1 1 auto;position:relative;min-height:0;display:flex;flex-direction:column}
/* vidéo framatalk intégrée */
#ft{flex:1 1 auto;min-height:0;position:relative;background:#000;border-bottom:1px solid rgba(0,200,255,.25)}
#ft iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
/* bandeau bas : identité + contrôles */
#foot{flex:0 0 auto;padding:10px 14px;display:flex;gap:10px;align-items:center;
  border-top:1px solid rgba(0,200,255,.3)}
#status{flex:1;font-size:11px;letter-spacing:.1em;color:#4d7f9e;text-transform:uppercase;line-height:1.6}
#status b{color:var(--blue)}
.btn{background:rgba(0,200,255,.12);border:1px solid rgba(0,200,255,.6);color:var(--blue-soft);
  padding:12px 18px;font-size:13px;letter-spacing:.2em;text-transform:uppercase;border-radius:4px}
.btn:active{background:rgba(0,200,255,.35)}
#mute-ind{position:absolute;top:10px;right:10px;z-index:5;background:rgba(255,30,60,.85);color:#fff;
  font-size:10px;letter-spacing:.2em;padding:4px 10px;border-radius:3px;display:none}
/* ── écran de sélection du groupe ── */
#pick{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:22px;padding:24px}
#pick h1{font-size:17px;letter-spacing:.35em;color:var(--white);text-transform:uppercase;text-align:center}
#pick p{font-size:12px;color:#4d7f9e;letter-spacing:.15em;text-transform:uppercase;text-align:center}
#groups{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.gbtn{width:88px;height:88px;border:1px solid rgba(0,200,255,.5);border-radius:6px;
  background:rgba(0,200,255,.07);color:var(--white);font-size:24px;font-weight:700;
  font-family:'Share Tech Mono',monospace}
.gbtn small{display:block;font-size:9px;color:#4d7f9e;letter-spacing:.15em;margin-top:4px}
.gbtn:active{background:rgba(0,200,255,.3)}
.hidden{display:none !important}
/* volume écoute */
#vol{position:absolute;bottom:10px;left:10px;z-index:5;display:flex;gap:8px;align-items:center}
#vol .btn{padding:8px 14px;font-size:11px}
</style>
</head>
<body>
<div id="pick">
  <h1>AURORA // BALISE</h1>
  <p>Sélectionner le groupe accompagné</p>
  <div id="groups"></div>
  <p style="margin-top:8px;max-width:420px;line-height:1.8;letter-spacing:.08em;text-transform:none">
    Écran verrouillé pendant la mission · caméra active · position transmise</p>
</div>

<div id="app" class="hidden">
  <div id="bar">
    <span>GROUPE <span id="grp">—</span></span>
    <span id="net" class="ko">HORS LIGNE</span>
  </div>
  <div id="main">
    <div id="ft">
      <div id="mute-ind">SON SALON COUPÉ</div>
      <div id="vol"><button class="btn" id="vol-up">VOL +</button><button class="btn" id="vol-dn">VOL −</button></div>
    </div>
  </div>
  <div id="foot">
    <div id="status">balise active — gps <b id="gps">—</b><br>liaison voix : <b id="link">établie au standard</b></div>
    <button class="btn" id="lock">VERROUILLER</button>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function(){
"use strict";
/* ═══ CONFIG ═══ */
var ROOM = "AURORA-MISSION-14";          /* salon framatalk commun */
var FT_ORIGIN = "https://framatalk.org";
var qs = /[?&]g=(\d)/.exec(location.search);

/* ═══ sélection du groupe ═══ */
var groupsEl = document.getElementById("groups");
for (var g = 1; g <= 5; g++){
  (function(n){
    var b = document.createElement("button");
    b.className = "gbtn";
    b.innerHTML = "G" + n + "<small>GROUPE " + n + "</small>";
    b.addEventListener("click", function(){ boot(n); });
    groupsEl.appendChild(b);
  })(g);
}
/* paramètre d'URL direct : balise.html?g=3 */
if (qs){ boot(parseInt(qs[1], 10)); }

function boot(n){
  document.getElementById("pick").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("grp").textContent = "G" + n;
  var MY_ID = "balise-g" + n;
  var STD_ID = "standard-aurora";        /* identité du standard (salle principale) */

  /* ═══ 1. FRAMATALK en iframe : caméra ON, micro OFF, son salon OFF ═══ */
  var iframe = document.createElement("iframe");
  iframe.allow = "camera; microphone; autoplay; fullscreen";
  iframe.src = FT_ORIGIN + "/" + ROOM + "#userInfo.displayName=BALISE%20G" + n +
    "&config.startWithVideoMuted=false&config.startWithAudioMuted=false&config.startScreenSharing=false";
  document.getElementById("ft").appendChild(iframe);
  /* le son du salon est contrôlé côté standard : ici on force muet dès que possible */
  try{
    var post = function(){ iframe.contentWindow.postMessage({ type:"setAudioOutputVolume", value: 0 }, FT_ORIGIN); };
    setTimeout(post, 4000); setTimeout(post, 8000); setTimeout(post, 15000);
  }catch(e){}
  document.getElementById("mute-ind").style.display = "block";

  /* ═══ 2. GPS : envoi de position ═══ */
  var lastPos = null, watchId = null;
  var netEl = document.getElementById("net");
  var gpsEl = document.getElementById("gps");
  function netOk(v){ netEl.className = v ? "ok" : "ko"; netEl.textContent = v ? "EN LIGNE" : "HORS LIGNE"; }

  /* ═══ 3. PeerJS : la voix arrive du standard ═══ */
  var peer = null, conn = null, audioEl = null, audioCtx = null;
  var linkEl = document.getElementById("link");
  function startPeer(){
    peer = new Peer(MY_ID, { debug: 0 });
    peer.on("open", function(){
      netOk(true);
      conn = peer.connect(STD_ID, { reliable: false });
      conn.on("open", function(){ linkEl.textContent = "établie"; sendState(); });
      conn.on("close", function(){ linkEl.textContent = "perdue — reconnexion…"; setTimeout(startPeer, 1500); });
    });
    peer.on("connection", function(c){ conn = c; });
    /* appel vocal entrant : le standard appelle, la voix sort au haut-parleur */
    peer.on("call", function(call){
      call.answer();                       /* on répond sans micro (réception seule) */
      call.on("stream", function(stream){
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        audioEl = audioEl || new Audio();
        audioEl.srcObject = stream;
        audioEl.volume = 1;
        audioEl.play().catch(function(){});
        /* iOS : l'AudioContext doit être débloqué par un geste */
        document.getElementById("vol-up").addEventListener("click", function(){
          if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
          audioEl.play().catch(function(){});
        });
      });
    });
    peer.on("error", function(e){
      if (e && e.type === "peer-unavailable"){ /* standard pas encore ouvert : réessai */ 
        setTimeout(function(){ if (!conn || !conn.open) startPeer(); }, 2500);
      } else { netOk(false); setTimeout(startPeer, 3000); }
    });
  }
  function sendState(){
    if (!conn || !conn.open) return;
    try{ conn.send({ t:"state", g:n, pos:lastPos, ts:Date.now() }); }catch(e){}
  }

  /* GPS */
  if (navigator.geolocation){
    watchId = navigator.geolocation.watchPosition(function(p){
      lastPos = { lat:p.coords.latitude, lng:p.coords.longitude, acc:Math.round(p.coords.accuracy), ts:Date.now() };
      gpsEl.textContent = "±" + lastPos.acc + " m";
      sendState();
    }, function(){ gpsEl.textContent = "indisponible"; }, { enableHighAccuracy:true, maximumAge:1000, timeout:8000 });
  }
  /* battement de cœur toutes les 5 s (position ou simple présence) */
  setInterval(sendState, 5000);
  window.addEventListener("online", function(){ netOk(true); });
  window.addEventListener("offline", function(){ netOk(false); });

  /* ═══ volume haut-parleur (guidage) ═══ */
  var vol = 0.9;
  document.getElementById("vol-up").addEventListener("click", function(){ vol = Math.min(1, vol + .15); if (audioEl) audioEl.volume = vol; });
  document.getElementById("vol-dn").addEventListener("click", function(){ vol = Math.max(0, vol - .15); if (audioEl) audioEl.volume = vol; });

  /* ═══ verrouillage d'écran impossible : garder l'écran allumé autant que possible ═══ */
  var wl = null;
  document.getElementById("lock").addEventListener("click", function(){
    if (navigator.wakeLock && !wl){ navigator.wakeLock.request("screen").then(function(l){ wl = l; document.getElementById("lock").textContent = "ÉCRAN VEILLÉ OK"; }); }
    else { document.getElementById("lock").textContent = "ÉCRAN VEILLÉ"; }
  });

  startPeer();
}
})();
</script>
</body>
</html>
