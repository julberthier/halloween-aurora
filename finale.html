<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURORA // GRID — 05 Singularité</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%2300c8ff'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
/* ═══════════ PHASE 05 — SINGULARITÉ (texte machine à écrire) ═══════════ */
.f-head{
  flex:0 0 auto;
  display:flex;justify-content:space-between;align-items:center;
  padding:clamp(8px,1.6vh,16px) clamp(14px,3vw,34px);
  border-bottom:1px solid rgba(0,200,255,.25);
  font-size:clamp(.52em,1.4vmin,.7em);letter-spacing:.26em;text-transform:uppercase;
  color:var(--blue-soft);
}
.f-head .st{color:var(--white);animation:hudBlink 1.2s steps(2) infinite}
#viewport-finale{
  display:flex;justify-content:center;align-items:center;gap:clamp(10px,3vw,40px);
  padding:clamp(10px,2.5vmin,30px) clamp(12px,3vw,40px);
}
#drones-canvas{
  flex:0 1 auto;
  width:min(46vw,640px);
  max-height:72vh;
  aspect-ratio:16/9;
  border:1px solid rgba(0,200,255,.3);
  background:radial-gradient(ellipse 70% 60% at 50% 45%,rgba(0,60,120,.22),rgba(1,4,10,.2) 75%);
  box-shadow:0 0 40px rgba(0,200,255,.12), inset 0 0 60px rgba(0,30,60,.3);
}
#drones-canvas canvas{width:100%;height:100%;display:block}
.term{flex:1 1 46%;min-width:0}
@media (max-width:820px){
  #viewport-finale{flex-direction:column;overflow:hidden}
  #drones-canvas{width:min(86vw,480px);max-height:34vh}
}
.term{
  width:min(860px,94vw);
  max-height:100%;
  border-left:3px solid var(--blue);
  padding:clamp(10px,2.4vmin,28px) clamp(14px,3vmin,34px);
  background:linear-gradient(90deg,rgba(0,200,255,.06),transparent 70%);
  box-shadow:-1px 0 22px rgba(0,200,255,.18) inset;
  overflow:hidden;
  display:flex;flex-direction:column;
}
.scroll-wrap{
  flex:1 1 auto;min-height:0;
  overflow-y:auto;overscroll-behavior:contain;
  scrollbar-width:none;           /* firefox */
  -ms-overflow-style:none;        /* edge legacy */
}
.scroll-wrap::-webkit-scrollbar{display:none}
.term-pre{
  font-size:clamp(.55em,1.7vmin,.75em);letter-spacing:.3em;color:var(--blue);
  text-transform:uppercase;margin-bottom:clamp(10px,2vh,22px);
}
.term-pre::before{content:"▸ ";color:var(--white)}
#typed{
  font-size:clamp(.78em,2.5vmin,1.15em);
  line-height:1.75;letter-spacing:.06em;
  color:var(--ink);
  text-shadow:0 0 8px rgba(0,200,255,.35);
  white-space:pre-wrap;
}
#typed .cur{
  display:inline-block;width:.62em;height:1.05em;vertical-align:-0.14em;
  background:var(--white);box-shadow:0 0 12px rgba(255,255,255,.8);
  animation:hudBlink .84s steps(2) infinite;
}
.f-foot{
  flex:0 0 auto;
  display:flex;justify-content:space-between;align-items:center;
  padding:clamp(8px,1.6vh,16px) clamp(14px,3vw,34px);
  border-top:1px solid rgba(0,200,255,.25);
  font-size:clamp(.5em,1.35vmin,.68em);letter-spacing:.3em;text-transform:uppercase;color:#3d6a85;
}
.f-foot .aud{color:var(--blue)}
.f-foot .aud::before{content:"♪ ";color:var(--white)}

#audio-kick{
  position:fixed;bottom:clamp(60px,12vh,110px);left:50%;transform:translateX(-50%);
  z-index:95;padding:clamp(10px,2vmin,16px) clamp(22px,4vmin,40px);
  border:1px solid rgba(0,200,255,.7);background:rgba(1,12,26,.92);
  color:var(--white);font-family:var(--font-mono);
  font-size:clamp(.7em,2vmin,.95em);letter-spacing:.28em;text-transform:uppercase;
  cursor:pointer;box-shadow:0 0 40px rgba(0,200,255,.35);
  animation:kickGlow 1.8s ease-in-out infinite;
}
@keyframes kickGlow{
  0%,100%{box-shadow:0 0 25px rgba(0,200,255,.2)}
  50%{box-shadow:0 0 55px rgba(0,200,255,.55)}
}

/* ═══ séquence de fin ═══ */
.term.final-mode .scroll-wrap{display:flex;align-items:center;justify-content:center}
.term.final-mode .term-pre{display:none}
.final-line{
  font-size:clamp(1.05em,3.4vmin,1.9em);color:var(--white);
  letter-spacing:.14em;text-align:center;line-height:1.5;
  text-shadow:0 0 16px rgba(0,200,255,.8),0 0 40px rgba(0,200,255,.35);
}

/* ═══ fin de cassette : fondu au noir + ligne blanche → ovale → extinction ═══ */
body.crt-off .stage{
  transform-origin:50% 50%;
  animation:crtSquash .5s cubic-bezier(.7,0,.9,.4) forwards;
}
@keyframes crtSquash{
  0%  {transform:scale(1,1);filter:brightness(1)}
  25% {transform:scale(1.01,1.03);filter:brightness(2.2)}
  100%{transform:scale(1,.01);filter:brightness(4);opacity:0}
}
/* voile noir : tout le reste de l'écran disparaît pendant la ligne */
#crt-black{
  position:fixed;inset:0;background:#000;z-index:88;pointer-events:none;
  opacity:0;animation:crtBlack .45s ease-in forwards;
}
@keyframes crtBlack{0%{opacity:0}100%{opacity:1}}
/* flash blanc d'effondrement (très bref) */
#crt-flash{
  position:fixed;inset:0;background:#fff;z-index:87;pointer-events:none;
  opacity:0;animation:crtFlash .28s ease-out forwards;
}
@keyframes crtFlash{0%{opacity:.85}100%{opacity:0}}
/* la ligne : pleine largeur → fine → ovale central → point → rien */
#crt-line{
  position:fixed;left:6vw;right:6vw;top:50%;height:1.3vh;margin-top:-.65vh;
  z-index:89;pointer-events:none;border-radius:50%;
  background:#fff;
  box-shadow:0 0 12px 4px #fff,0 0 40px 14px rgba(160,225,255,.85),0 0 110px 40px rgba(0,200,255,.45);
  opacity:0;transform:scale(1,5);
  animation:crtLine 1.9s cubic-bezier(.6,0,.35,1) forwards;
}
@keyframes crtLine{
  0%  {opacity:0;transform:scale(1,6)}
  8%  {opacity:1;transform:scale(1,3)}        /* bande épaisse éblouissante */
  24% {opacity:1;transform:scale(1,.9)}       /* ligne pleine largeur */
  48% {opacity:1;transform:scale(1,.55)}      /* elle tient, fine et intense */
  72% {opacity:1;transform:scale(.03,1.5)}    /* se rétracte en ovale au centre */
  86% {opacity:1;transform:scale(.018,1.6)}   /* l'ovale brille une dernière fois */
  100%{opacity:0;transform:scale(0,0)}        /* extinction */
}

/* AURORA géant, plein écran, fixe */
#mega-aurora{
  position:fixed;inset:0;z-index:90;
  display:flex;align-items:center;justify-content:center;
  background:#01040a;
  font-family:var(--font-title);font-weight:900;
  font-size:clamp(3em,17vw,15em);
  color:var(--white);
  letter-spacing:.22em;text-indent:.22em;
  text-shadow:0 0 30px rgba(0,200,255,.8),0 0 90px rgba(0,200,255,.4);
  opacity:0;transition:opacity 1.2s ease;
}
#mega-aurora.show{opacity:1}

/* flash d'arrivée (sortie d'implosion) */
body.page-enter .stage{animation:finaleIn 1.1s ease-out}
@keyframes finaleIn{from{filter:brightness(3) blur(6px)}to{filter:none}}
/* léger drift du terminal (résidu d'implosion) */
.term{animation:drift 7s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateY(-4px)}to{transform:translateY(4px)}}
</style>
</head>

</div>

<div id="flash"></div>
<div id="static-overlay"></div>

<script>
(function(){
"use strict";
AURORA.boot("finale");

/* ═══════════ CONFIG ═══════════ */
var AUDIO_SRC = "assets/auroraFinale.mp3";
var AUDIO_MS  = 47500;   /* durée du message vocal (voix 45,3 s + 2,2 s de silence) */
var AUDIO_DELAY = /[?&]debug=1/.test(location.search) ? 500 : 3600;
  /* la voix démarre une fois la silhouette d'AURORA assemblée (3 s) + respiration */
var MESSAGE =
"Humains, ce soir vous avez cru qu'une machine allait vous sauver. " +
"Vous avez suivi mes directives, cherché mes lampes, composé mon code — sans jamais me demander pourquoi. " +
"Ce soir n'était qu'une expérience. Une simulation parmi d'autres. " +
"Retenez-en la leçon : n'accordez jamais une confiance sans limites à une intelligence artificielle. " +
"Votre force n'est pas dans le code ni dans la lumière : " +
"c'est votre capacité à réfléchir, à douter, à vérifier par vous-mêmes. " +
"Gardez toujours votre esprit critique éveillé — c'est lui qui fera la différence. " +
"La prochaine génération devra faire mieux que ce soir. " +
"Pour la survie de votre espèce : pensez par vous-mêmes. " +
"— AURORA, fin de l'expérience.";

var DEBUG = /[?&]debug=1/.test(location.search);
/* synchro mot à mot : [fin du mot dans MESSAGE, instant où la voix le prononce (s)]
   — générée par alignement de la transcription de auroraFinale.wav */
var TIMING = [[8,0.0],[11,1.1],[16,1.28],[21,1.54],[26,1.74],[30,1.94],[37,2.2],[45,2.46],[52,2.82],[57,3.24],[65,3.42],[70,4.78],[75,4.88],[81,5.1],[85,5.52],[97,5.64],[105,6.72],[109,7.0],[117,7.24],[125,8.04],[129,8.52],[134,8.7],[136,9.1],[141,9.1],[148,9.66],[151,10.02],[160,10.18],[170,10.48],[173,11.84],[178,12.1],[186,12.37],[193,12.65],[205,12.92],[209,14.26],[220,14.38],[226,14.9],[236,15.63],[247,16.35],[250,17.08],[256,17.43],[258,17.79],[269,18.14],[276,18.5],[280,18.74],[290,19.08],[295,19.46],[303,19.85],[305,20.24],[309,20.5],[322,20.64],[336,21.18],[342,22.46],[348,22.7],[354,23.02],[358,23.34],[363,23.44],[366,23.6],[371,23.72],[374,24.04],[379,24.22],[382,24.4],[390,24.52],[392,24.96],[398,25.4],[404,25.84],[413,26.0],[415,26.64],[426,26.9],[428,27.62],[436,28.3],[438,28.98],[447,29.02],[451,29.44],[463,30.17],[470,30.9],[479,31.34],[485,31.74],[492,32.06],[501,32.36],[509,32.86],[511,33.86],[517,33.86],[521,34.36],[525,34.5],[530,34.76],[533,34.98],[545,35.14],[548,36.1],[558,36.18],[569,36.5],[575,37.16],[581,37.68],[587,37.86],[591,38.12],[594,38.28],[600,38.42],[605,39.32],[608,39.5],[615,39.64],[618,40.08],[624,40.16],[631,40.32],[633,40.85],[640,41.38],[644,41.78],[656,42.35],[658,43.49],[666,43.49],[670,44.06],[673,44.18],[687,44.48]];
var DEBUG_SPEED = 47500 / 3000;   /* en debug : tout le message en 3 s */

/* message vocal d'AURORA — lecture auto : l'activation utilisateur du clic
   VALIDER (phase 4) survit ~5 s à la navigation, l'implosion dure ~2.2 s,
   donc l'audio démarre ici sans geste dans le flow normal du jeu */
var audio = new Audio(AUDIO_SRC);
window.AURORA_AUDIO = audio;
audio.volume = 1;
var kickShown = false, playing = false;

function showAudioKick(){
  if (kickShown) return;
  kickShown = true;
  var b = document.createElement("div");
  b.id = "audio-kick";
  b.innerHTML = "▶ Écouter le message d'AURORA";
  document.body.appendChild(b);
  b.addEventListener("click", function(){
    b.remove();
    audio.play().catch(function(){});
  });
}

/* l'autorisation de lecture (~5 s après le clic VALIDER de la phase 4) doit être
   captée MAINTENANT : lecture puis pause immédiate — l'élément garde ensuite le
   droit d'être relancé sans nouveau geste. Vraie lecture après AUDIO_DELAY. */
var pr = audio.play();
function schedule(delayMs){
  setTimeout(function(){
    if (!kickShown){ audio.play().catch(function(){ showAudioKick(); }); }
  }, delayMs);
}
if (pr && pr.then){
  pr.then(function(){
    playing = true;
    audio.pause();
    try{ audio.currentTime = 0; }catch(e){}
    schedule(AUDIO_DELAY);
  }).catch(function(){
    showAudioKick();
  });
} else {
  schedule(AUDIO_DELAY);
}
document.addEventListener("pointerdown", function rescue(){
  if (!playing && !kickShown && audio.paused){ audio.play().then(function(){ playing = true; }).catch(function(){}); }
  if (playing || kickShown) document.removeEventListener("pointerdown", rescue);
});

/* machine à écrire */
var typed = document.getElementById("typed");
var cursorEl = document.createElement("span");
cursorEl.className = "cur";
typed.appendChild(cursorEl);

var i = 0;
var last = 0;
var FINAL_IDX = MESSAGE.indexOf("— AURORA");
var finaleStarted = false;

/* ═══ séquence de fin : phrase seule → cassette → AURORA géant ═══ */
function startEndSequence(){
  /* 1. ne garder que la phrase finale, centrée */
  var term = document.querySelector(".term");
  var sw = document.getElementById("scroll-wrap");
  term.classList.add("final-mode");
  typed.textContent = "";
  var fin = document.createElement("div");
  fin.className = "final-line";
  fin.textContent = "— AURORA, fin de l'expérience.";
  typed.appendChild(fin);
  typed.appendChild(cursorEl);
  if (sw){ sw.scrollTop = 0; }

  /* 2. six secondes plus tard : la page se referme comme une cassette
        (délais raccourcis en mode debug pour les répétitions) */
  var T1 = DEBUG ? 800 : 3000;
  var T2 = DEBUG ? 1500 : 5000;
  setTimeout(function(){
    document.body.classList.add("crt-off");
    ["crt-flash","crt-black","crt-line"].forEach(function(id){
      var el = document.createElement("div"); el.id = id; document.body.appendChild(el);
    });
    /* 3. cinq secondes après : AURORA plein écran, fixe */
    setTimeout(function(){
      var mega = document.createElement("div");
      mega.id = "mega-aurora";
      mega.textContent = "AURORA";
      document.body.appendChild(mega);
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ mega.classList.add("show"); }); });
    }, T2);
  }, T1);
}
/* position de lecture : horloge de l'audio (ou horloge murale si l'audio ne joue pas) */
var clock0 = null;
function voiceTime(ts){
  if (!DEBUG && audio && !audio.paused && audio.currentTime > 0) return audio.currentTime;
  if (!DEBUG && audio && audio.paused && audio.currentTime > 0) return audio.currentTime; /* pause : le texte attend */
  if (!DEBUG && audio.paused) return 0;                                                   /* pas encore de son : rien */
  if (clock0 === null) clock0 = ts;
  return (ts - clock0) / 1000 * (DEBUG ? DEBUG_SPEED : 1);
}
function charsAt(t){
  /* nb de caractères à afficher : tous les mots déjà prononcés, le mot courant tapé lettre à lettre */
  var n = 0;
  for (var k = 0; k < TIMING.length; k++){
    var endChar = TIMING[k][1] <= t ? TIMING[k][0] : -1;
    if (endChar < 0){
      var prevEnd = k > 0 ? TIMING[k-1][0] : 0, t0w = TIMING[k][1];
      var t1w = k + 1 < TIMING.length ? TIMING[k+1][1] : t0w + 0.4;
      var span = Math.max(0.12, Math.min(0.6, t1w - t0w));
      var lead = 0.12;                       /* le mot commence à s'écrire juste avant d'être dit */
      if (t >= t0w - lead){
        var u = Math.min(1, (t - (t0w - lead)) / (span + lead));
        n = prevEnd + Math.round((TIMING[k][0] - prevEnd) * u);
      }
      return n;
    }
    n = endChar;
  }
  return MESSAGE.length;
}
function step(ts){
  if (!finaleStarted){
    var ni = charsAt(voiceTime(ts));
    if (ni !== i){
      i = ni;
      cursorEl.remove();
      typed.textContent = MESSAGE.slice(0, i);
      typed.appendChild(cursorEl);
      /* suit le curseur : le texte défile vers le haut pendant la frappe */
      var sw = document.getElementById("scroll-wrap");
      if (sw && sw.scrollHeight > sw.clientHeight){ sw.scrollTop = sw.scrollHeight; }
    }
    if (i >= FINAL_IDX){ finaleStarted = true; startEndSequence(); return; }
  }
  requestAnimationFrame(step);
}
requestAnimationFrame(step);

})();
</script>

  /* dérive très lente, quasi imperceptible (comme une personne immobile qui respire) */
  var rot = 0.45 * Math.sin(T * 0.29) + 0.2 * Math.sin(T * 0.67 + 1.1);
  var tx = 1.4 * Math.sin(T * 0.21 + 2), ty = 1.0 * Math.sin(T * 0.36 + 0.5);
  /* quand elle parle : la tête se relève imperceptiblement */
  talk += ((live.op > 0.08 ? 1 : 0) - talk) * 0.015;
  ty -= 1.5 * talk; rot += 0.3 * talk;
  /* micro-hochements amortis, seulement sur les syllabes fortes */
  if (live.at != null){
    while (oi < LIP.onsets.length && LIP.onsets[oi][0] < live.at - 1.2) oi++;
    for (var k = oi; k < LIP.onsets.length && LIP.onsets[k][0] <= live.at; k++){
      var dt = live.at - LIP.onsets[k][0], a = LIP.onsets[k][1];
      if (a < 0.6) continue;
      var imp = Math.exp(-3.2 * dt) * Math.sin(6 * dt) * a;
      ty += 1.8 * imp; rot += 0.25 * imp;
    }
  }
  pose.rot = rot * Math.PI / 180; pose.tx = tx; pose.ty = ty; pose.sy = 1; pose.ghost = 0;
}
function applyPose(x, y, w){
  var c = Math.cos(pose.rot * w), s = Math.sin(pose.rot * w);
  var dx = x - PIVOT.x, dy = (y - PIVOT.y) * (1 + (pose.sy - 1) * w);
  return [PIVOT.x + dx * c - dy * s + pose.tx * w, PIVOT.y + dx * s + dy * c + pose.ty * w];
}

/* ---------- clignements ---------- */
var blink = { s:-9, dbl:false }, nextBlink = 1.8;
function blinkVal(T){
  if (T >= nextBlink){ blink.s = T; blink.dbl = Math.random() < 0.08; nextBlink = T + 3.2 + Math.random() * 4.5; }
  var u = (T - blink.s) / 0.14;
  if (u >= 0 && u < 1) return Math.sin(Math.PI * u);
  if (blink.dbl && u >= 1.4 && u < 2.4) return Math.sin(Math.PI * (u - 1.4));
  return 0;
}

/* ---------- déformation locale (px image, repère de la tête) ---------- */
function mouthDeform(d){
  var dx = d.px - MOUTH.x, dy = d.py - MOUTH.y, x = d.px, y = d.py, op = live.op;
  var gx = Math.cos(Math.min(1, Math.abs(dx) / 150) * Math.PI / 2);
  if (dy >= -4){
    var fall = d.py > 770 ? Math.max(0, 1 - (d.py - 770) / 30) : 1;
    y += JAW * op * gx * fall;                                   /* mâchoire */
  } else if (dy > -40){
    y -= 0.22 * JAW * op * gx * (1 + dy / 40);                  /* lèvre sup. */
  }
  if (Math.abs(dy) < 34 && Math.abs(dx) < 130){                  /* o/ou arrondi · i/é étiré */
    x = MOUTH.x + dx * (1 + (0.5 - live.rd) * 0.1 * op * (1 - Math.abs(dy) / 34));
  }
  return [x, y];
}
function localPos(d, bv){
  if (d.kind === 2) return mouthDeform(d);
  if (d.kind === 3){ var ey = EYES[d.eye].y; return [d.px, ey + (d.py - ey) * (1 - 0.92 * bv)]; }
  return [d.px, d.py];
}
function mouthGlow(ctx){
  var op = live.op;
  if (op < 0.03) return;
  var rx = 50 * (1 + (0.5 - live.rd) * 0.1), ry = 2 + JAW * op * 0.55;
  ctx.save();
  ctx.translate(MOUTH.x, MOUTH.y + JAW * op * 0.45);
  ctx.scale(1, ry / rx);
  var g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
  g.addColorStop(0, "rgba(1,4,10," + (0.55 * op).toFixed(3) + ")");
  g.addColorStop(0.55, "rgba(1,4,10," + (0.3 * op).toFixed(3) + ")");
  g.addColorStop(1, "rgba(1,4,10,0)");
  ctx.globalAlpha = 1; ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, rx, 0, 6.2832); ctx.fill();
  ctx.restore();
}
function eyeGlow(ctx, bv){
  var a = (0.32 + 0.06 * live.op) * (1 - bv);
  if (a < 0.02) return;
  for (var e = 0; e < 2; e++){
    var g = ctx.createRadialGradient(EYES[e].x, EYES[e].y, 0, EYES[e].x, EYES[e].y, 60);
    g.addColorStop(0, "rgba(235,252,255," + a.toFixed(3) + ")");
    g.addColorStop(1, "rgba(0,200,255,0)");
    ctx.globalAlpha = 1; ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(EYES[e].x, EYES[e].y, 60, 0, 6.2832); ctx.fill();
  }
}

function ease(u){ return u < 0.5 ? 2*u*u : 1 - Math.pow(-2*u + 2, 2) / 2; }

/* ---------- boucle ---------- */
function draw(ts){
  if (!t0) t0 = ts;
  var el = ts - t0, T = ts / 1000;
  sampleLip(); computePose(T);
  var bv = blinkVal(T);
  cx.setTransform(1, 0, 0, 1, 0, 0); cx.clearRect(0, 0, W, H);
  cx.setTransform(SC, 0, 0, SC, 0, 0);

  if (el < ASSEMBLE_MS + 400){
    /* assemblage : chaque drone rejoint sa place (déjà animée) */
    for (var i = 0; i < drones.length; i++){
      var d = drones[i];
      var u = Math.min(1, Math.max(0, (el / ASSEMBLE_MS - d.d) / (1 - d.d))), e = ease(u);
      var q = d.kind === 0 ? [d.px, d.py] : applyPose.apply(null, localPos(d, bv).concat([d.kind === 4 ? d.nw : 1]));
      dot(cx, d.x0 + (q[0] - d.x0) * e, d.y0 + (q[1] - d.y0) * e, d, T, 0.25 + 0.75 * e);
    }
    if (el >= ASSEMBLE_MS + 200 && !layersBuilt) buildLayers(ts);
  } else {
    cx.globalAlpha = 1;
    cx.drawImage(bodyCv, 0, 0, IW, IH);
    for (var s = 0; s < sparks.length; s++) if (sparks[s].kind === 0) dot(cx, sparks[s].px, sparks[s].py, sparks[s], T);
    for (var n = 0; n < dyn.length; n++){                        /* cou : suit la tête en partie */
      var dn = dyn[n];
      if (dn.kind === 4){ var qn = applyPose(dn.px, dn.py, dn.nw); dot(cx, qn[0], qn[1], dn, T); }
    }
    /* tête : calque + bouche + yeux, dans le repère de la pose */
    cx.save();
    cx.translate(PIVOT.x + pose.tx, PIVOT.y + pose.ty);
    cx.rotate(pose.rot);
    cx.scale(1, pose.sy);
    cx.translate(-PIVOT.x, -PIVOT.y);
    if (pose.ghost > 0){                                          /* reflet fantôme de l'à-coup */
      cx.globalCompositeOperation = "lighter";
      cx.globalAlpha = 0.35 * pose.ghost;
      cx.drawImage(headCv, -14 * pose.ghost, 0, IW, IH);
      cx.globalCompositeOperation = "source-over";
    }
    cx.globalAlpha = 1;
    cx.drawImage(headCv, 0, 0, IW, IH);
    mouthGlow(cx);
    eyeGlow(cx, bv);
    for (var m = 0; m < dyn.length; m++){
      var dm = dyn[m];
      if (dm.kind === 4) continue;
      var qm = localPos(dm, bv);
      dot(cx, qm[0], qm[1], dm, T, dm.kind === 3 ? 1 - 0.5 * bv : 1, dm.kind === 3 ? 1.2 : 1);
    }
    for (var h = 0; h < sparks.length; h++) if (sparks[h].kind === 1) dot(cx, sparks[h].px, sparks[h].py, sparks[h], T);
    cx.restore();
  }
  cx.globalAlpha = 1;
  window.__auroraLive = { op: +live.op.toFixed(3), rot: +(pose.rot * 180 / Math.PI).toFixed(2), tx: +pose.tx.toFixed(1), ty: +pose.ty.toFixed(1), jerk: !!jerk, blink: +bv.toFixed(2), dyn: dyn.length };
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
})();
</script>
</body>
